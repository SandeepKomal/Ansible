name: Ansible validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible ansible-lint

      - name: Syntax-check all example playbooks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            ansible-playbook -i localhost, -c local "$file" --syntax-check
          done < <(find playbooks "yaml files" -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)

      - name: Lint playbooks
        run: ansible-lint playbooks/ "yaml files/"
