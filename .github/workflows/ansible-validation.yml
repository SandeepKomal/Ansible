name: Ansible validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ansible content
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible ansible-lint

      - name: Check starter playbook syntax
        run: ansible-playbook -i localhost, -c local playbooks/hello.yml --syntax-check

      - name: Lint maintained playbooks
        run: ansible-lint playbooks/
