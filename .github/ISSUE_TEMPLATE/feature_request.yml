name: Feature request
description: Suggest a playbook, guide, or repository improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the use case or learning gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the playbook, pattern, or documentation you would like to see.
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Target platform
      description: List the Linux distribution/version, architecture, or cloud environment if applicable.
    validations:
      required: false
