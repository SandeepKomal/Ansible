---
# Amazon Corretto package name; adapt for other Linux distributions.
- name: Install Java 17 using Amazon Corretto
  hosts: all
  become: true
  tasks:
    - name: Ensure Java 17 is installed
      ansible.builtin.package:
        name: java-17-amazon-corretto-headless
        state: present

    - name: Check Java version
      ansible.builtin.command:
        argv:
          - java
          - --version
      register: java_version_output
      changed_when: false

    - name: Display Java version
      ansible.builtin.debug:
        var: java_version_output.stdout_lines
