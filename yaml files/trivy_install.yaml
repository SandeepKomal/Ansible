---
# Pinned to Trivy v0.75.0. For production use, verify release checksums/signatures
# and consider Aqua's documented package/repository installation options.
- name: Install Trivy from a Linux AMD64 archive
  hosts: all
  become: true
  vars:
    trivy_version: "0.75.0"
    trivy_archive: "/tmp/trivy_{{ trivy_version }}_Linux-64bit.tar.gz"
    trivy_extract_dir: "/tmp/trivy-v{{ trivy_version }}"
  tasks:
    - name: Download Trivy archive
      ansible.builtin.get_url:
        url: "https://github.com/aquasecurity/trivy/releases/download/v{{ trivy_version }}/trivy_{{ trivy_version }}_Linux-64bit.tar.gz"
        dest: "{{ trivy_archive }}"
        mode: "0644"

    - name: Create extraction directory
      ansible.builtin.file:
        path: "{{ trivy_extract_dir }}"
        state: directory
        mode: "0755"

    - name: Extract Trivy binary
      ansible.builtin.unarchive:
        src: "{{ trivy_archive }}"
        dest: "{{ trivy_extract_dir }}"
        remote_src: true
        creates: "{{ trivy_extract_dir }}/trivy"

    - name: Install versioned Trivy binary
      ansible.builtin.copy:
        src: "{{ trivy_extract_dir }}/trivy"
        dest: "/usr/local/bin/trivy-{{ trivy_version }}"
        remote_src: true
        mode: "0755"

    - name: Point Trivy command to the selected version
      ansible.builtin.file:
        src: "/usr/local/bin/trivy-{{ trivy_version }}"
        dest: /usr/local/bin/trivy
        state: link
        force: true

    - name: Verify Trivy installation
      ansible.builtin.command:
        argv:
          - /usr/local/bin/trivy
          - --version
      register: trivy_version_output
      changed_when: false

    - name: Display Trivy version
      ansible.builtin.debug:
        var: trivy_version_output.stdout
