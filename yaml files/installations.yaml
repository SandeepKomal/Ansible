---
# Convenience entry point that composes the individual tool installers.
# Review all imports and confirm OS compatibility before using this on a host.
# Some tools are intended for x86_64 Linux; see each playbook's comments.
- ansible.builtin.import_playbook: git_install.yaml
- ansible.builtin.import_playbook: java17_install.yaml
- ansible.builtin.import_playbook: docker_install.yaml
- ansible.builtin.import_playbook: kustomize.yaml
- ansible.builtin.import_playbook: trivy_install.yaml
- ansible.builtin.import_playbook: maven_install/maven_install.yaml
- ansible.builtin.import_playbook: amazon_cli.yaml
