---
# This example expects a Linux distribution whose configured package
# repositories provide the "docker" package. Verify vendor-specific steps
# for Amazon Linux 2023, Ubuntu, and other distributions before use.
- name: Install and start Docker Engine
  hosts: all
  become: true
  tasks:
    - name: Install Docker package
      ansible.builtin.package:
        name: docker
        state: present
      tags:
        - install_docker

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      tags:
        - start_docker
        - enable_docker

# Security note: membership in the docker group can grant root-equivalent
# control. Add users to that group only after reviewing your security policy.
