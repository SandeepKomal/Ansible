---
# This example expects a Linux distribution whose configured package
# repositories provide the "docker" package. Verify vendor-specific steps
# for Amazon Linux 2023, Ubuntu, and other distributions before use.
- name: Install and start Docker Engine
  hosts: all
  become: true
  tasks:
    - name: Install Docker package
      ansible.builtin.package:
        name: docker
        state: present
      tags:
        - install_docker

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      tags:
        - start_docker
        - enable_docker

    - name: Check Docker service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - docker
      register: docker_service_status
      changed_when: false
      tags:
        - verify

    - name: Display Docker service state
      ansible.builtin.debug:
        msg: "Docker service is {{ docker_service_status.stdout }}"
      tags:
        - verify

# Security note: membership in the docker group can grant root-equivalent
# control. Add users to that group only after reviewing your security policy.
