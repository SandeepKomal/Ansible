---
# Install Maven using an explicitly pinned version. Review release availability
# and checksums at the Apache Maven project before upgrading this version.
- name: Install and configure Apache Maven
  hosts: all
  become: true
  vars:
    maven_version: "3.9.11"
    maven_archive: "/tmp/apache-maven-{{ maven_version }}-bin.tar.gz"
    maven_install_dir: "/opt/apache-maven-{{ maven_version }}"
  tasks:
    - name: Ensure Java is available
      ansible.builtin.command:
        argv:
          - java
          - --version
      changed_when: false

    - name: Download Apache Maven archive
      ansible.builtin.get_url:
        url: "https://dlcdn.apache.org/maven/maven-3/{{ maven_version }}/binaries/apache-maven-{{ maven_version }}-bin.tar.gz"
        dest: "{{ maven_archive }}"
        mode: "0644"

    - name: Extract Apache Maven
      ansible.builtin.unarchive:
        src: "{{ maven_archive }}"
        dest: /opt
        remote_src: true
        creates: "{{ maven_install_dir }}"

    - name: Point the stable Maven symlink to the selected version
      ansible.builtin.file:
        src: "{{ maven_install_dir }}"
        dest: /opt/maven
        state: link
        force: true

    - name: Configure Maven environment
      ansible.builtin.template:
        src: maven.sh.j2
        dest: /etc/profile.d/maven.sh
        owner: root
        group: root
        mode: "0644"
